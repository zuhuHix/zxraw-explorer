[package]
name = "forge-app"
description = "ZXraw Explorer desktop application (egui/eframe UI)."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
automation = []

[[bin]]
name = "zxraw"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
chrono.workspace = true
directories.workspace = true
lru.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
winit.workspace = true
rfd.workspace = true
image = { workspace = true, features = ["png"] }
kamadak-exif.workspace = true
regex.workspace = true
sha2.workspace = true
zip.workspace = true
forge-core.workspace = true
forge-jobs.workspace = true
forge-db.workspace = true
forge-media.workspace = true
forge-win.workspace = true
gix = { version = "0.89", default-features = false, features = ["index", "excludes", "sha1"] }
filetime = "0.2"
flate2 = "1"
windows = { workspace = true, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
notify = { version = "8.2", default-features = false }
ab_glyph = "0.2"

[dev-dependencies]
tempfile.workspace = true

# e2e: a stand-in for the Desktop's paste (OLE clipboard + IFileOperation).
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_DataExchange", "Win32_System_Memory"] }

[build-dependencies]
embed-resource = "3.0.12"
