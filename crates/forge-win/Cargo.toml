[package]
name = "forge-win"
description = "Windows shell integration (Recycle Bin, ShellExecute, drives, properties) for ZXraw Explorer."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
md-5.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows = { workspace = true, features = ["Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Com_StructuredStorage", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_Networking_WinHttp", "Win32_System_StationsAndDesktops", "Win32_System_Ioctl", "Win32_System_IO", "Win32_Security", "Win32_Storage_FileSystem", "Win32_NetworkManagement_WNet", "Win32_System_SystemServices", "Win32_System_Com_Marshal", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust HTTPS (rustls + webpki roots) in place of WinHTTP.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# File clipboard: X11 selections without libxcb, and the Wayland data-control protocol.
x11rb = { version = "0.14", default-features = false, features = ["xtest"] }
wl-clipboard-rs = "0.9"

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
