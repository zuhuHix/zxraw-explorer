[package]
name = "forge-win"
description = "Windows shell integration (Recycle Bin, ShellExecute, drives, properties) for ZXraw Explorer."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
md-5.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows = { workspace = true, features = ["Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Com_StructuredStorage", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_Networking_WinHttp", "Win32_System_StationsAndDesktops", "Win32_System_Ioctl", "Win32_System_IO", "Win32_Security", "Win32_Storage_FileSystem", "Win32_NetworkManagement_WNet"] }

[dev-dependencies]
tempfile.workspace = true
