[workspace]
resolver = "3"
members = [
    "crates/forge-core",
    "crates/forge-jobs",
    "crates/forge-db",
    "crates/forge-media",
    "crates/forge-win",
    "crates/forge-app",
    "crates/forge-cli",
    "crates/forge-bench",
]
default-members = ["crates/forge-app", "crates/forge-cli"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zuhuHix/zxraw-explorer"
rust-version = "1.90"

[workspace.dependencies]
# internal
forge-core = { path = "crates/forge-core" }
forge-jobs = { path = "crates/forge-jobs" }
forge-db = { path = "crates/forge-db" }
forge-media = { path = "crates/forge-media" }
forge-win = { path = "crates/forge-win" }

# shared
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
regex = "1.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
directories = "6.0"
blake3 = "1.8"
sha2 = "0.10"
md-5 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
lru = "0.18"
tempfile = "3.27"
clap = { version = "4.6", features = ["derive"] }

# storage
rusqlite = { version = "0.40", features = ["bundled"] }

# media
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "gif", "bmp"] }
kamadak-exif = "0.6"

# archives
# Codecs chosen deliberately: zlib-rs + zopfli deflate, pure-Rust bzip2/lzma/xz, zstd (C, built
# statically by cc), deflate64 and ppmd decoders, AES (AE-1/AE-2) and ZipCrypto.
zip = { version = "9.1.3", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "xz", "zstd", "ppmd", "aes-crypto"] }

# 7z: pure Rust (Apache-2.0). LZMA/LZMA2/PPMd/BZip2/Deflate/Copy, BCJ/BCJ2/ARM/ARM64/Delta,
# AES-256 data and headers; writes LZMA2 (+BCJ), Copy and AES. Same lzma-rust2/ppmd/bzip2/aes
# versions as zip, so nothing is built twice.
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["aes256", "bzip2", "compress", "ppmd", "deflate"] }
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "encoder", "xz"] }
crc32fast = "1.4"

# tar and single-file streams (.gz .bz2 .xz .zst .lz4 .br): the same flate2 (zlib-rs), bzip2
# (pure Rust), lzma-rust2 (xz) and zstd as zip and 7z; plus pure-Rust LZ4 frames and Brotli.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6"
zstd = { version = "0.14", features = ["zstdmt"] }
lz4_flex = "0.14"
brotli = "9.1"

zeroize = "1.8"
# Same versions the zip crate uses: decrypting the head of encrypted entries.
aes = "0.9"
pbkdf2 = "0.13"
sha1 = "0.11"

# ui
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
egui = "0.36"
# Same version eframe uses; only for the Windows message hook (`paste_key`).
winit = { version = "0.30", default-features = false }
egui_extras = { version = "0.36", features = ["image"] }
rfd = "0.17"

# windows
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_RestartManager",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Graphics_Imaging",
] }

[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"

[profile.dev.package."*"]
# Media decoding is unbearably slow unoptimized; keep deps fast in dev builds.
opt-level = 2

[profile.dev.package.forge-media]
# Our own decode/resize code is hot too (the viewer agent observed ~2 s per preview decode
# in an unoptimised dev build; not re-measured).
opt-level = 2
