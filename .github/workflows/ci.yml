name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (build and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build all targets
        run: cargo build --workspace --all-targets

      # forge-app's e2e target runs in the linux-e2e job, so it is left out here.
      - name: Test (other crates)
        run: cargo test --workspace --exclude forge-app --no-fail-fast

      - name: Test (forge-app unit tests)
        if: success() || failure()
        run: cargo test -p forge-app --bins --no-fail-fast

  linux-e2e:
    name: Linux (e2e under Xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ZXRAW_E2E_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Each e2e run starts its own Xvfb, so no xvfb-run wrapper is needed.
      # Rendering is software (Mesa llvmpipe/lavapipe).
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev \
            xvfb mesa-vulkan-drivers libgl1-mesa-dri libegl1 ffmpeg

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-09
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: E2E tests
        run: cargo test -p forge-app --test e2e --no-fail-fast

      - name: Upload screenshots from failed runs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zxraw-e2e-screenshots
          path: /tmp/zxfr-shots
          if-no-files-found: ignore

  linux-packages:
    name: Linux packages (AppImage, .deb)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-09
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build AppImage and .deb
        run: bash packaging/linux/build-linux.sh

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zxraw-linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error

  windows:
    name: Windows (build and test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The runner's %TEMP% is an 8.3 short path (C:\Users\RUNNER~1\...), while the shell
      # and OLE report long paths, so tests comparing the two fail. RUNNER_TEMP (D:\a\_temp)
      # has no short components.
      - name: Use a long-named temp folder
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build all targets
        run: cargo build --workspace --all-targets

      # forge-app's e2e target is not run here.
      # Skipped on the hosted runner only: its image has no HEIF/AV1 WIC codec ("component
      # initialization has failed", 0x88982F8B). It passes on a desktop with the HEIF and AV1
      # extensions installed.
      - name: Test (other crates)
        shell: bash
        run: >
          cargo test --workspace --exclude forge-app --no-fail-fast --
          --skip wic::tests::wic_encodes_and_decodes_available_heif_and_avif_fixtures

      - name: Test (forge-app unit tests)
        if: success() || failure()
        run: cargo test -p forge-app --bins --no-fail-fast
